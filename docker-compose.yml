version: '3.8'

services:
  db:
    image: mysql:8.0
    entrypoint: ["sh", "-c", "chmod +x /docker-entrypoint-initdb.d/wait-for-backup.sh && /docker-entrypoint-initdb.d/wait-for-backup.sh && exec docker-entrypoint.sh mysqld"]
    volumes:
      - ./wait-for-backup.sh:/docker-entrypoint-initdb.d/wait-for-backup.sh
      - db_data:/var/lib/mysql
      - ./mysql-files:/var/lib/mysql-files
      - ./backups:/root/backups
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}

  wordpress:
    depends_on:
      - db
    build:
      context: .
    ports:
      - "${EXPOSE_PORT}:443"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1300M
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      URL: ${URL}
      TABLE_PREFIX: ${TABLE_PREFIX}
    volumes:
      - ./wordpress:${WORK_DIR}/
      - ./script.sh:/usr/local/bin/script.sh
      - ./.env:/usr/local/bin/.env
      - ./backups:/root/backups
      - ./old_db.sql:/root/old_db.sql
      - ./.ssh:/root/.ssh
      - ./wp-config.php:/root/wp-config.php
      - ./wp-cli.yml:/root/wp-cli.yml
      - signal_volume:/signal
  
  db-backup:
    image: alpine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    build: 
      context: .
      dockerfile: Dockerfile.alpine
    volumes:
      - ./backup.sh:/backup.sh
      - db_backup:/db_backup
      - signal_volume:/signal
      - ./.env:/.env
      - ./backups:/root/backups
    environment:
      MYSQL_HOST: ${WORDPRESS_DB_HOST}
      MYSQL_PORT: 3306
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      TABLE_PREFIX: ${TABLE_PREFIX}
      S3_BUCKET: ${S3_BACKUP_LOCATION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    command: sh -c "chmod +x /backup.sh && /backup.sh"
    depends_on:
      - db
volumes:
  db_data: {}
  db_backup: {}
  signal_volume: {}
